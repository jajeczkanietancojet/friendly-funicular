
name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s \
            /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project NaSpacerze.xcodeproj \
            -scheme NaSpacerze \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: NaSpacerze-iOS-Simulator
          path: build/Build/Products/Release-iphonesimulator/*.app
