name: NaSpacerze

options:
  deploymentTarget:
    iOS: "17.0"

targets:
  NaSpacerze:
    type: application
    platform: iOS

    sources:
      - path: .
        includes:
          - "**/*.swift"
        excludes:
          - ".github/**"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.jajeczkanietancojet.NaSpacerze
        PRODUCT_NAME: NaSpacerze
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Aplikacja wykorzystuje lokalizację podczas spaceru z psem."
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_API_BASE_URL: "http://192.168.1.173:5000"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
